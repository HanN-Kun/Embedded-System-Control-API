services:
  db:
    image: postgres:16
    container_name: proje-db
    environment:
      POSTGRES_PASSWORD: sifre123
      POSTGRES_DB: proje_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proje-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: proje-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    build: .
    container_name: proje-api
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:sifre123@db:5432/proje_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: ${RABBITMQ_URL}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  email-worker:
    build: .
    container_name: proje-email-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: postgresql://postgres:sifre123@db:5432/proje_db
      SECRET_KEY: ${SECRET_KEY}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    command: python -m app.messaging.email_worker

  sensor-worker:
    build: .
    container_name: proje-sensor-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: postgresql://postgres:sifre123@db:5432/proje_db
      SECRET_KEY: ${SECRET_KEY}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    command: python -m app.messaging.sensor_worker

  virtual-sensor:
    build: .
    container_name: proje-virtual-sensor
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:sifre123@db:5432/proje_db
      RABBITMQ_URL: ${RABBITMQ_URL}
      SECRET_KEY: ${SECRET_KEY}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      VIRTUAL_SENSOR_ID: ${VIRTUAL_SENSOR_ID}
    command: python -m app.simulators.virtual_sensor

volumes:
  pgdata:
  rabbitmq_data: